services:
  apis:
    build:
      context: .
      target: apis
    image: apis:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/data
    depends_on:
      - redis

  # Token storage for spotify. AOF persistence keeps the OAuth tokens
  # across container restarts.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  redis-data:
